<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Osobisty kalendarz planowania posiłków." />
    <!-- Both of these are the pre-boot value only: `lib/theme.svelte.ts` rewrites them from
         the stored choice as the first thing `main.ts` does. They stay light because that is
         the theme a browser with no stored choice and no dark system setting gets, and because
         the production CSP allows no inline script to resolve it any earlier. -->
    <meta name="color-scheme" content="light" />
    <!-- --color-accent from app.css. Colours the status bar of the installed app. -->
    <meta name="theme-color" content="#529888" />
    <!-- iOS reads these and ignores the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eat My Way" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>Eat My Way</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
