name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same ref makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test & build
    runs-on: ubuntu-latest
    steps:
      # Full history: the app's version comes from `git describe`, and a shallow clone with
      # no tags would leave every CI build calling itself by a commit hash (decision 235).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & template check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

  e2e:
    name: End-to-end (login & sync)
    runs-on: ubuntu-latest
    steps:
      # Full history: the app's version comes from `git describe`, and a shallow clone with
      # no tags would leave every CI build calling itself by a commit hash (decision 235).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium, and only when the lockfile changed: the browser download is the one
      # real cost of this job.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # No Google credentials are involved: the suite answers every request to
      # accounts.google.com and www.googleapis.com itself, and playwright.config.ts builds
      # the app with a placeholder client id.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
